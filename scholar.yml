name: Update Google Scholar citations

on:
  schedule:
    - cron: "0 3 * * *"   # every day, 03:00 UTC
  workflow_dispatch:       # manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scholarly
        run: pip install scholarly

      - name: Fetch citations from Google Scholar
        run: python update_scholar.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain scholar.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scholar.json
            git commit -m "Update Google Scholar citations"
            git push
          else
            echo "No changes."
          fi
